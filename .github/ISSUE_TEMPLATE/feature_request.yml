name: Feature request
description: Something tlk-grid should be able to do and cannot.
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        The roadmap in the README lists what is already planned. If your idea is
        one of those, say so here and it moves up rather than being filed twice.

  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The situation, not the solution. What are you doing when this comes up?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would solve it
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
