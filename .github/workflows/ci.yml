name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The runner has a desktop, so the live window-enumeration smoke test runs
      # here too rather than being skipped in CI.
      - name: Test
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: tlk-grid
          path: target/release/tlk-grid.exe
