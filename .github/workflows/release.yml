name: release

# Tagging is the release. Nothing publishes on a push to main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release

      - name: Name the binary after the tag and checksum it
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          exe="tlk-grid-${version}-x64.exe"
          cp target/release/tlk-grid.exe "$exe"
          sha256sum "$exe" | cut -d" " -f1 > "$exe.sha256"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          draft: true
          generate_release_notes: true
          files: |
            tlk-grid-*-x64.exe
            tlk-grid-*-x64.exe.sha256
