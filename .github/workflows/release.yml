name: release

# Tagging is the release. Nothing publishes on a push to main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release

      - name: Name the binary after the tag and checksum it
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          exe="tlk-grid-${version}-x64.exe"
          cp target/release/tlk-grid.exe "$exe"
          sha256sum "$exe" | cut -d" " -f1 > "$exe.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            tlk-grid-*-x64.exe
            tlk-grid-*-x64.exe.sha256
