<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tlk-grid — Crosshair</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="module">

<header class="module-bar">
  <span class="dot"></span>TLK-GRID
  <small>crosshair</small>
</header>

<main class="module-body">
  <div class="module-card">
    <div class="module-head">
      <span class="badge">CROSSHAIR</span>
      <h1 data-i18n="crosshair.title">Your own reticle, dead centre</h1>
    </div>

    <div class="section">
      <h3 data-i18n="crosshair.image">Image</h3>
      <p class="hint" data-i18n="crosshair.imageHint"></p>

      <div class="preview crosshair-preview" style="aspect-ratio:16/9"></div>

      <div class="pair" style="margin-top:10px">
        <button class="btn pick" type="button" data-i18n="crosshair.pick">Choose a PNG…</button>
      </div>
      <input class="file" type="file" accept="image/png,image/jpeg,image/gif" hidden>

      <div class="control">
        <div class="label">
          <b data-i18n="crosshair.scale">Size</b>
          <span data-i18n="crosshair.scaleHint"></span>
        </div>
        <input class="scale" type="range" min="25" max="400" step="5" value="100">
        <span class="value scale-value">100%</span>
      </div>

      <div class="control">
        <div class="label">
          <b data-i18n="crosshair.show">Show it</b>
          <span data-i18n="crosshair.showHint"></span>
        </div>
        <button class="switch visible" type="button" role="switch" aria-checked="false"></button>
      </div>
    </div>

    <ul class="behaviour">
      <li data-i18n="crosshair.b1"></li>
      <li data-i18n="crosshair.b2"></li>
      <li data-i18n="crosshair.b3"></li>
      <li data-i18n="crosshair.b4"></li>
    </ul>
  </div>

  <button class="danger remove" type="button" data-i18n="crosshair.remove">Remove the image</button>
</main>

<footer class="statusbar" data-tone="info" role="status" aria-live="polite"></footer>

<script type="module" src="js/crosshair.js"></script>
</body>
</html>
